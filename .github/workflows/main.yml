name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Не заданы секреты KEYSTORE_B64 и KEYSTORE_PASS (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.jks

      - name: Тесты и сборка
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk AutoJournal.apk

      - name: Ошибки сборки
        if: failure()
        run: |
          {
            grep -E "^e: |error:|FAILED|What went wrong|Exception|expected:|Caused by|AssertionError|> Task .*FAILED" build.log || true
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] && grep -A6 "<failure" "$f" || true
            done
          } | head -c 9000 > errors.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Ошибки сборки::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoJournal-apk
          path: AutoJournal.apk

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: АвтоЖурнал, сборка ${{ github.run_number }}
          body: Скачайте AutoJournal.apk и установите на телефон. Новая версия ставится поверх старой, данные сохраняются.
          files: AutoJournal.apk
          make_latest: true
