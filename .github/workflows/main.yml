name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk AutoJournal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoJournal-apk
          path: AutoJournal.apk
      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: АвтоЖурнал, сборка ${{ github.run_number }}
          body: Скачайте AutoJournal.apk и установите на телефон. Новая версия ставится поверх старой, данные сохраняются.
          files: AutoJournal.apk
          make_latest: true
